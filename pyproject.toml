[project]
name = "m4.2_middleware_harvester"
dynamic = ["version"]
description = "The FAIRagro Middleware Harvester"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "inspire",
  "harvester",
  "linked_data",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pylint>=4.0.6",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-env>=1.2.0",
  "pytest-mock>=3.10.0",
  "mypy>=1.20.1",
  "bandit>=1.7.0",
  "ruff>=0.16.0",
  "pre-commit>=4.0.0",
  "respx>=0.23.1",
  "ggshield>=1.53.0",
  "cryptography>=49.0.0",
  "pyjwt>=2.12.0",
  "pyopenssl>=26.3.0",
  "python-dotenv>=1.2.2",
]

[tool.uv.sources]
inspire = { workspace = true }
harvester = { workspace = true }
linked_data = { workspace = true }

[tool.uv.workspace]
members = [
    "middleware/inspire",
    "middleware/harvester",
    "middleware/linked_data",
]

# ggshield 1.51.0 pins old transitive deps; override until upstream bumps.
[tool.uv]
override-dependencies = [
  "cryptography>=49.0.0",
  "pyjwt>=2.12.0",
  "pyopenssl>=26.3.0",
  "python-dotenv>=1.2.2",
  "requests>=2.33.0",
]

# Ruff / Mypy / Pylint: synced ruff.toml, mypy.ini, .pylintrc (no product ruff overlay).
# Path overlays: MYPYPATH / pylint --source-roots / stubs/ — not in pyproject.

[tool.pytest.ini_options]
# Test discovery
testpaths = [
    "middleware/inspire/tests",
    "middleware/harvester/tests",
    "middleware/linked_data/tests"
]
pythonpath = [
    "middleware/inspire/src",
    "middleware/harvester/src",
    "middleware/linked_data/src",
    "middleware/linked_data/tests/unit",
    "middleware/inspire/tests/unit",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output and behavior
addopts = [
    "-v",                        # Verbose output
    "--strict-markers",          # Treat unregistered markers as errors
    "--tb=short",                # Shorter traceback format
]
# NOTE: Coverage flags (--cov, --cov-fail-under) are intentionally NOT in addopts.
# Running them for every single test in VS Code would show falsely low coverage.
# Use: uv run pytest --cov=middleware --cov-report=term-missing --cov-fail-under=80

# Asyncio mode
asyncio_mode = "auto"

# Custom markers
markers = [
    "asyncio: marks tests as async",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # rdflib's JSON-LD parser internally uses ConjunctiveGraph; this is a
    # third-party issue and cannot be fixed in application code.
    "ignore::DeprecationWarning:rdflib",
]

[tool.coverage.run]
# Coverage measurement settings
source = [
    "middleware/inspire/src/middleware/inspire",
    "middleware/harvester/src/middleware/harvester",
    "middleware/linked_data/src/middleware/linked_data"
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/.pytest_cache/*",
    "*/build/*",
    "*/dist/*",
    "*/*.egg-info/*",
]
branch = true  # Measure branch coverage

[tool.coverage.report]
# Coverage reporting settings
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"


[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
git_describe_command = "git describe --dirty --tags --long --match [0-9].[0-9]*"

[tool.hatch.build.targets.wheel]
include = ["README.md"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
