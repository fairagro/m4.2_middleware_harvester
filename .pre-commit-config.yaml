# Pre-commit configuration
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# All hooks use 'uv run' to execute tools defined in pyproject.toml
# This ensures consistency with the quality-check.sh script and uv.lock

repos:
  # Built-in hooks (no dependencies needed)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [manual, pre-push]
      - id: end-of-file-fixer
        stages: [manual, pre-push]
      - id: check-yaml
        exclude: ^helm/[^/]+/templates/.*\.ya?ml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  # All Python quality checks using uv run (local hooks)
  - repo: local
    hooks:
      # ggshield - secret scan (version from pyproject.toml / uv.lock)
      - id: ggshield
        name: ggshield secret scan
        entry: uv run ggshield secret scan pre-commit
        language: system
        pass_filenames: false

      # Ruff - Linting (same as CI: uv run ruff check)
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --no-fix
        language: system
        types: [python]

      # Ruff - Formatting (same as CI: uv run ruff format --check --diff)
      # IDE: formatOnSave via .venv/bin/ruff + pyproject.toml (same lockfile binary).
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --diff
        language: system
        types: [python]

      # mypy - Type checking (full middleware/ tree; only when Python under middleware/ changes)
      - id: mypy
        name: mypy type check
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
        files: ^middleware/
        args: [--config-file, pyproject.toml, middleware/]

      # bandit - Security linting (same as CI: uv run bandit -r middleware/ -c .bandit -ll)
      - id: bandit
        name: bandit security scan
        entry: uv run bandit -r middleware/ -c .bandit -ll
        language: system
        pass_filenames: false
        types: [python]
        files: ^middleware/

      # pylint - Code quality (same as CI: uv run pylint middleware/)
      - id: pylint
        name: pylint
        entry: uv run pylint middleware/
        language: system
        pass_filenames: false
        types: [python]
        files: ^middleware/

      # pytest - Unit tests only (runs on pre-push to keep commits fast)
      - id: pytest-unit
        name: pytest unit tests
        entry: bash -c "uv run pytest middleware/*/tests/unit/"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Container Structure Test (runs on pre-push)
      - id: container-structure-test
        name: container structure test
        entry: bash scripts/run-container-structure-test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
