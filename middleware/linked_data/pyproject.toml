[project]
name = "linked_data"
version = "0.1.0"
description = "Linked Data harvester plugin for FAIRagro Middleware Harvester"
requires-python = ">=3.12"
dependencies = [
    "arctrl>=3.1.1",
    "defusedxml>=0.7.1",
    "pydantic>=2.0.0",
    "rdflib>=7.0.0",
    "fairagro-middleware-shared>=11.1.1.dev33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # rdflib's JSON-LD parser internally uses ConjunctiveGraph; this is a
    # third-party issue and cannot be fixed in application code.
    "ignore::DeprecationWarning:rdflib",
]
