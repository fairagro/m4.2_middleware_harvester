[project]
name = "parsing"
version = "0.1.0"
description = "Shared discovery units and PayloadParser registry for FAIRagro Middleware Harvester"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "rdflib>=7.0.0",
    "fairagro-middleware-shared>=11.1.1.dev34",
    "payload",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/unit"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:rdflib",
]
