[project]
name = "harvester"
dynamic = ["version"]
description = "Core orchestrator for FAIRagro Middleware Harvester"
requires-python = ">=3.12"
dependencies = [
    "arctrl>=3.2.1",
    "pydantic>=2.0.0",
    "fairagro-middleware-api-client>=11.1.1.dev34",
    "fairagro-middleware-shared>=11.1.1.dev34",
    "inspire",
    "linked_data",
    "generic",
    "oai_pmh",
    "parsing",
    "payload",
    "contracts",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Release builds set SETUPTOOLS_SCM_PRETEND_VERSION from APP_VERSION (docker/Dockerfile.product-app.base);
# this version is what `harvester --version` reports.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
local_scheme = "no-local-version"
git_describe_command = "git describe --dirty --tags --long --match [0-9].[0-9]*"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
