name: Pre Release

permissions:
  contents: write
  packages: write
  security-events: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Base version bump (auto = Conventional Commits via git-cliff; RC suffix still applied on build/*)'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - major
        - minor
        - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-quality:
    name: Code Quality
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@16382189b5f803f02a80c8a5992b90f721178a7f
    with:
      python_package_root: middleware
      components: '["harvester"]'
      # MYPYPATH / PYLINT_SOURCE_ROOTS: .devcontainer/product.env (empty inputs → quality_env_file)
    secrets: inherit

  build:
    name: Build
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@main
    with:
      version_bump: ${{ inputs.version_bump }}
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit

  check:
    name: Check
    needs: build
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-check.yml@main
    with:
      version: ${{ needs.build.outputs.version }}
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit

  release:
    name: Release
    needs: [build, check, code-quality]
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-release.yml@main
    with:
      version: ${{ needs.build.outputs.version }}
      pep440_version: ${{ needs.build.outputs.pep440_version }}
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
      release_type: 'feature'
      create_github_release: false
      tag_prefix: 'docker-v'
    secrets: inherit
