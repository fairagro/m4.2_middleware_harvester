name: Feature Pull Request

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'

jobs:
  code-quality:
    name: Code Quality
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@a061d6fb85afc8dfd54083ff58bf788744dcdca8
    with:
      python_package_root: middleware
      components: '["harvester"]'
      mypy_path: stubs:middleware/inspire/src:middleware/harvester/src:middleware/linked_data/src:middleware/linked_data/tests/unit:middleware/inspire/tests/unit
      pylint_source_roots: middleware/linked_data/tests/unit,middleware/inspire/tests/unit
    secrets: inherit

  build:
    name: Build
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@main
    with:
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit

  check:
    name: Check
    needs: build
    if: always() && needs.build.result == 'success'
    # Local until Devinfra #74: omit Trivy licence-check (Alpine GPL noise).
    uses: ./.github/workflows/reusable-check-local.yml
    with:
      version: ${{ needs.build.outputs.version }}
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit
