name: Feature Pull Request

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'

concurrency:
  group: feature-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'middleware/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docker-bake.hcl'
              - 'versions.env'
              - 'ruff.toml'
              - 'mypy.ini'
              - '.pylintrc'
              - '.pre-commit-config.yaml'
              - '.bandit'
              # Do NOT put chart paths only here — that forces Docker build/check
              # without a separate Helm lint job.
            helm:
              - 'charts/**'

  code-quality:
    name: Code Quality
    needs: detect-changes
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@371ac9cefdf4c36ddc906d3ddff9e92e0b7af0cf
    with:
      python_package_root: middleware
      components: '["harvester"]'
      # MYPYPATH / PYLINT_SOURCE_ROOTS: .devcontainer/product.env (empty inputs → quality_env_file)
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit

  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@main
    with:
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit

  check:
    name: Check
    needs: [detect-changes, build]
    # Docs-only: build is skipped → still run check with skip=true (required checks).
    # Code PR: only run check when build succeeded (avoid empty-version secondary failure).
    if: >-
      always()
      && needs.detect-changes.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-check.yml@main
    with:
      # toJSON/fromJSON avoids Actions LS false positive on needs.build.outputs.version
      # when the build job is conditional (docs-only skip path).
      version: ${{ fromJSON(toJSON(needs.build)).outputs.version || '' }}
      components: '["harvester"]'
      image_base_name: fairagro-advanced-middleware
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit

  arc-export-fixtures:
    name: ARC export fixtures
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: No code changes — skipping arc-export fixtures
        if: ${{ needs.detect-changes.outputs.code != 'true' }}
        run: echo "No code paths changed. Exiting with success."

      - name: Checkout code
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        uses: actions/checkout@v7

      - name: Install uv
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync workspace
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        run: uv sync --dev --all-packages

      - name: Build arc-export PATH wrapper and run system_local suite
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        run: |
          set -euo pipefail
          # Single SoT: middleware/harvester/tests/system_local/arc-export-base.digest
          ARC_EXPORT_BASE="$(tr -d '[:space:]' < middleware/harvester/tests/system_local/arc-export-base.digest)"
          docker pull "${ARC_EXPORT_BASE}"
          printf 'FROM %s\nRUN ln -sf /arc-export /usr/local/bin/arc-export\n' "${ARC_EXPORT_BASE}" \
            | docker build -t fairagro-arc-export-path:ci -f- /tmp
          export FAIRAGRO_ARC_EXPORT_IMAGE=fairagro-arc-export-path:ci
          uv run pytest -m system_local middleware/harvester/tests/system_local -v

  helm-lint:
    name: Helm Lint
    needs: detect-changes
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-helm-lint.yml@main
    with:
      chart_dir: charts/harvester
      skip: ${{ needs.detect-changes.outputs.helm != 'true' }}
    secrets: inherit

  # Extra reusable-helm-lint calls share one concurrency group
  # (repo + caller workflow + PR) and cancel each other — smoke fixtures here.
  helm-fixture-smoke:
    name: Helm fixture smoke
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: No chart changes — skipping fixture smoke
        if: ${{ needs.detect-changes.outputs.helm != 'true' }}
        run: echo "No chart files changed. Exiting with success."

      - name: Checkout code
        if: ${{ needs.detect-changes.outputs.helm == 'true' }}
        uses: actions/checkout@v7

      - name: Load HELM_VERSION from versions.env
        if: ${{ needs.detect-changes.outputs.helm == 'true' }}
        id: versions
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          HELM_PIN="${HELM_VERSION#v}"
          if [[ -z "$HELM_PIN" ]]; then
            echo "::error::HELM_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "helm=${HELM_PIN}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        if: ${{ needs.detect-changes.outputs.helm == 'true' }}
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Template catalog, list-only; expect-fail both-set
        if: ${{ needs.detect-changes.outputs.helm == 'true' }}
        run: |
          set -euo pipefail
          chart=charts/harvester
          helm template ci-smoke "./${chart}" -f charts/harvester/fixtures/values-catalog.yaml >/dev/null
          helm template ci-smoke "./${chart}" -f charts/harvester/fixtures/values-list-only.yaml >/dev/null
          if helm template ci-smoke "./${chart}" -f charts/harvester/fixtures/values-both-fail.yaml >/dev/null 2>&1; then
            echo "::error::values-both-fail.yaml should fail render (enabled catalog + non-empty repositories)"
            exit 1
          fi
          echo "helm fixture smoke: catalog + list-only ok; both-fail failed as expected"
