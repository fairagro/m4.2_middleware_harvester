name: Reusable Code Quality

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      components:
        description: 'A JSON string array of components to check'
        required: false
        type: string
        default: '["harvester"]'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --all-packages

      - name: Code formatting and linting
        env:
          MYPYPATH: stubs:middleware/inspire/src:middleware/harvester/src:middleware/linked_data/src:middleware/linked_data/tests/unit:middleware/inspire/tests/unit
        run: |
          uv run ruff format --check --diff --config ruff.toml middleware/
          uv run ruff check --config ruff.toml middleware/
          uv run pylint --rcfile .pylintrc \
            --extension-pkg-allow-list=lxml \
            --source-roots=middleware/linked_data/tests/unit,middleware/inspire/tests/unit \
            middleware/inspire middleware/linked_data middleware/harvester
          uv run mypy --config-file mypy.ini middleware/

      - name: Security check with bandit
        run: uv run bandit -r middleware/ -c .bandit -ll

      - name: Run tests
        run: uv run pytest middleware/ -v --junitxml=pytest-report.xml
