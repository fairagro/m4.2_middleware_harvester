# config.fixtures.yaml for the compose stack.
#
# Identical to config.fixtures.yaml except that the fixture origin and the mock
# Middleware API are addressed by compose service name rather than localhost.
# Keep the two files in sync.

log_level: INFO

repositories:
  - rdi: "openagrar-fixture"
    generic:
      protocol:
        http:
          respect_robots_txt: false
          max_requests_per_second: null
        mycore_solr:
          entry_url: "http://fixtures:8080/servlets/solr/select"
    parser:
      html_jsonld:
        allowed_context_url: "https://schema.org/"
    mapper:
      schema_org_general: {}

api_client:
  api_url: "http://middleware-api:8000"
  timeout: 60.0
  verify_ssl: false
