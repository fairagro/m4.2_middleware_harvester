services:
  harvester:
    # Built via `./start.sh --build` → `docker buildx bake harvester` (versions.env pins
    # + Bake contexts). Do not `docker compose build` this service: Dockerfile.harvester
    # is a last stage that needs named contexts from docker-bake.hcl.
    image: harvester:latest
    environment:
      CLIENT_KEY_DATA: ${data}
    tmpfs:
      - /run/secrets:mode=1777
    volumes:
      - ./config.yaml:/etc/harvester/config.yaml:ro
      - ./client.crt:/etc/harvester/client.crt:ro
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - "printf '%s' \"$$CLIENT_KEY_DATA\" > /run/secrets/client.key && /middleware/harvester/harvester -c /etc/harvester/config.yaml"
    restart: no
