api_client:
  api_url: "https://middleware-test.fairagro.net"
  timeout: 60.0
  client_cert_path: "/etc/harvester/client.crt"
  client_key_path: "/run/secrets/client.key"
  verify_ssl: true
  max_retries: 3
  retry_backoff_factor: 1.0
