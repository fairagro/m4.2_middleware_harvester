log_level: INFO

repositories:

  - rdi: "bonares"
    inspire:
      csw_url: "https://repository-staging.dataservice.zalf.de/catalogue/csw"
    mapper:
      type: inspire_general

  - rdi: "edal"
    generic:
      protocol:
        xml:
          entry_url: https://doi.ipk-gatersleben.de/sitemap.xml
    parser:
      type: html_jsonld
      allowed_context_url: "https://schema.org/"
    mapper:
      type: schema_org_general
  # Legacy linked_data form (deprecated plugin key; prefer nested generic above):
  # - rdi: "edal-legacy"
  #   linked_data:
  #     sitemap_url: https://doi.ipk-gatersleben.de/sitemap.xml
  #     sitemap_type: xml
  #     dataset_type: html_jsonld
  #     allowed_context_url: "https://schema.org/"
  #   mapper:
  #     type: schema_org_general
  # Example: MyCoRe Solr discovery via nested protocol (query-free select URL;
  # defaults fill core/q/fl/rows; wt=json is always set by the software)
  # - rdi: "openagrar-solr"
  #   generic:
  #     protocol:
  #       http:
  #         # OpenAgrar robots.txt Disallow: /servlets/ blocks the Solr API path.
  #         respect_robots_txt: false
  #       mycore_solr:
  #         entry_url: "https://www.openagrar.de/servlets/solr/select"
  #         # page_size: 200
  #   parser:
  #     type: html_jsonld
  #     allowed_context_url: "https://schema.org/"
  #   mapper:
  #     type: schema_org_general
  # Deprecated linked_data mycore_solr shim (warns; prefer nested generic above):
  # - rdi: "openagrar-solr-legacy"
  #   linked_data:
  #     sitemap_url: "https://www.openagrar.de/servlets/solr/select"
  #     sitemap_type: mycore_solr
  #     dataset_type: html_jsonld
  #     allowed_context_url: "https://schema.org/"
  #     http:
  #       respect_robots_txt: false
  #   mapper:
  #     type: schema_org_general

  # Example: PUBLISSO FRL via Regal /find — keep linked_data until a
  # regal_jsonld PayloadParser exists (shared jsonld rejects remote @context).
  # - rdi: "publisso"
  #   linked_data:
  #     sitemap_url: "https://frl.publisso.de/find"
  #     sitemap_type: regal_find
  #     dataset_type: regal_jsonld
  #     # Optional; default 200. Sets /find `until` unless URL has until=.
  #     # page_size: 200
  #     # Optional override; default is derived from sitemap_url host + /resource/
  #     resource_base_url: "https://repository.publisso.de/resource/"
  #     # FRL robots.txt is User-agent: * / Disallow: / (blocks all polite clients).
  #     # /find remains a public machine API; disable robots checks for this RDI.
  #     http:
  #       respect_robots_txt: false
  #   mapper:
  #     type: regal_general

  # Example: PhenoRoam via OAI-PMH (native pr:metadataDataset XML)
  # - rdi: "phenoroam"
  #   oai_pmh:
  #     endpoint_url: "https://phenoroam.phenorob.de/geonetwork/srv/eng/oaipmh"
  #     metadata_prefix: phenoroam
