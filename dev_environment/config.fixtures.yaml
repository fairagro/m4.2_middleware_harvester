# Fixture-only harvester config: the static OpenAgrar stand-in, nothing live.
#
# Use this to exercise the schema.org title-fallback cascade (#164) end to end
# without touching the network. The real OpenAgrar is behind a proof-of-work
# gate (#271), so it cannot be harvested; see
# dev_environment/fixtures/openagrar/README.md for what the fixtures contain.
#
# Needs two local services:
#   uv run python -m http.server 8080 --directory dev_environment/fixtures/openagrar
#   DEMO_OUTPUT_DIR=$PWD/dev_environment/demo_output \
#     uv run --with fastapi --with uvicorn --with arctrl \
#     uvicorn demo_api_main:app --app-dir dev_environment --host 127.0.0.1 --port 8000

log_level: INFO

repositories:
  # Legacy HTML JSON-LD title-fallback cascade (#164) against reconstructed receive pages.
  - rdi: "openagrar-fixture"
    generic:
      protocol:
        http:
          # Mirrors the real OpenAgrar config: robots.txt disallows /servlets/,
          # where the Solr API lives.
          respect_robots_txt: false
          # No politeness delay against a local static server.
          max_requests_per_second: null
        mycore_solr:
          entry_url: "http://localhost:8080/servlets/solr/select"
    parser:
      html_jsonld:
        allowed_context_url: "https://schema.org/"
    mapper:
      schema_org_general: {}

  # Preferred OpenAgrar path: MyCoRe REST + MODS (#503). List file under api/v2/objects/
  # so python -m http.server can serve both the list and object XML files.
  - rdi: "openagrar-mods-fixture"
    generic:
      protocol:
        http:
          respect_robots_txt: true
          max_requests_per_second: null
        mycore_rest:
          entry_url: "http://localhost:8080/api/v2/objects/list.xml"
          page_size: 50
    parser:
      mods_xml: {}
    mapper:
      mods_general: {}

api_client:
  api_url: "http://localhost:8000"
  timeout: 60.0
  verify_ssl: false
