# Every RDI that can actually be harvested, plus the OpenAgrar fixture stand-in.
#
# Intended for before/after comparison runs: harvest the same set on two git
# branches and diff the JSON-LD reports the harvester writes to stdout.
#
# Needs the same two local services as config.fixtures.yaml (static fixture
# server on :8080, mock Middleware API on :8000).
#
# Run times are dominated by e!DAL: 338 records with robots.txt Crawl-delay: 1,
# so roughly six minutes. publisso is 92 records on one page; bonares is 27.

log_level: INFO

repositories:
  # INSPIRE/CSW. Untouched by the linked_data mapper work -- included to show
  # the orchestrator is unaffected.
  # NOTE: config.yaml still points at repository-staging.dataservice.zalf.de,
  # which no longer resolves. repository-e is the working host.
  - rdi: "bonares"
    inspire:
      csw_url: "https://repository-e.dataservice.zalf.de/catalogue/csw"
    mapper:
      type: inspire_general
      # Per-RDI placeholder strings treated as empty in optional fields. Setting
      # the list replaces the defaults (None, null, N/A, No abstract provided,
      # Keine Zusammenfassung vorhanden, No information provided); $var and
      # {{var}} templates always count.
      # placeholder_values: ["None", "No information provided"]

  # The other real schema_org_general + html_jsonld source, and so the only
  # live RDI that could regress from a GeneralSchemaOrgMapper change.
  - rdi: "edal"
    generic:
      protocol:
        xml:
          entry_url: https://doi.ipk-gatersleben.de/sitemap.xml
    parser:
      type: html_jsonld
    mapper:
      type: schema_org_general

  # Regal, not schema.org -- proves the shared Dataset/MappingContext plumbing
  # did not disturb the other mapper.
  # Stay on linked_data until a regal_jsonld PayloadParser exists: shared
  # parser.type: jsonld rejects Regal's remote @context (e.g. …/context.json).
  - rdi: "publisso"
    linked_data:
      sitemap_url: "https://frl.publisso.de/find"
      sitemap_type: regal_find
      dataset_type: regal_jsonld
      resource_base_url: "https://repository.publisso.de/resource/"
      http:
        # FRL robots.txt is User-agent: * / Disallow: / -- /find is a public
        # machine API, so robots checks are disabled for this RDI.
        respect_robots_txt: false
    mapper:
      type: regal_general

  # DCAT-AP (ckanext-dcat, Hydra-paginated) via the generic plugin:
  # dcat_ap Protocol -> jsonld PayloadParser -> ckanext_dcat DataMapper.
  # SRADI is the first RDI on this path; a second ckanext-dcat RDI only needs
  # a new repository entry, no new code. See m4_rdi_portfolio#8.
  - rdi: "sradi"
    generic:
      protocol:
        dcat_ap:
          entry_url: "https://agrihub.gis.lrg.tum.de/catalog.jsonld"
    parser:
      type: jsonld
    mapper:
      type: ckanext_dcat
      catalog_name: "Smart Rural Areas Data Infrastructure (SRADI)"
      catalog_url: "https://agrihub.gis.lrg.tum.de"

  # PlabiPD (fairagro/m4_rdi_portfolio#7) -- schema.org Dataset dump describing published plant
  # genomes (via usadellab/pubplant2schemaorg), via the generic plugin:
  # pubplant_json_array Protocol -> jsonld PayloadParser -> schema_org_general DataMapper.
  # Not paginated: one GET returns the full array. DOIs are not unique across records;
  # see pubplant_json_array's composite-identifier scheme.
  - rdi: "plabipd"
    generic:
      protocol:
        pubplant_json_array:
          entry_url: "https://raw.githubusercontent.com/usadellab/pubplant2schemaorg/gh-pages/genomes.json"
    parser:
      type: jsonld
    mapper:
      type: schema_org_general

  # Static stand-in for OpenAgrar; see fixtures/openagrar/README.md.
  - rdi: "openagrar-fixture"
    generic:
      protocol:
        http:
          respect_robots_txt: false
          max_requests_per_second: null
        mycore_solr:
          entry_url: "http://localhost:8080/servlets/solr/select"
    parser:
      type: html_jsonld
    mapper:
      type: schema_org_general

  # The real OpenAgrar cannot be harvested: record pages, servlets/solr/select
  # and sitemap_google.xml all 302 to /pow-challenge. Tracked in #271.
  # - rdi: "openagrar"
  #   generic:
  #     protocol:
  #       http:
  #         respect_robots_txt: false
  #       mycore_solr:
  #         entry_url: "https://www.openagrar.de/servlets/solr/select"
  #   parser:
  #     type: html_jsonld
  #   mapper:
  #     type: schema_org_general

  - rdi: "phenoroam"
    oai_pmh:
      endpoint_url: "https://phenoroam.phenorob.de/geonetwork/srv/eng/oaipmh"
      metadata_prefix: phenoroam
    parser:
      type: phenoroam_xml
    mapper:
      type: phenoroam_general

api_client:
  api_url: "http://localhost:8000"
  timeout: 60.0
  verify_ssl: false
